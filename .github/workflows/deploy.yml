name: Deploy Kaghaz20

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            cd /root/kaghaz20/kaghaz20-frontend

            git pull origin main

            npm ci --force

            npm run build

            pm2 restart kaghaz20 --update-env

            pm2 save
